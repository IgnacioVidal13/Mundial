<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Álbum Mundial - Gestión Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS BASE --- */
        body {
            margin: 0;
            font-family: 'Oswald', Arial, sans-serif;
            background: #111;
        }

        /* --- HEADER --- */
        header {
            background: #111;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid gold;
        }

        header div { color: gold; font-size: 22px; font-weight: 700; }

        nav button {
            margin-left: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .todas { background: #2196F3; color: white; }
        .tengo { background: #4CAF50; color: white; }
        .repetidas { background: #FFC107; color: #333; }
        .faltan { background: #F44336; color: white; }
        .pdf { background: #ffffff; color: #ff0000; }
        /* --- FONDO DINÁMICO --- */
        main {
            padding: 20px;
            min-height: 100vh;
            color: white;
            background: linear-gradient(270deg, #ffffff, #67b7f4, #ffffff, #679cff);
            background-size: 800% 800%;
            animation: lava 18s ease infinite;
        }

        @keyframes lava {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

  


        /* --- PROGRESO --- */
        #contador { margin-bottom: 15px; font-size: 18px; font-weight: bold; text-shadow: 0 0 5px black; }

        
        #barra-container {
            width: 100%; height: 35px; background: #222;
            border-radius: 20px; position: relative; margin-bottom: 30px;
        }

        #barra {
            height: 100%; width: 0%; background: linear-gradient(90deg, #d4af37, #ffd700, #d4af37);
            border-radius: 20px; transition: width 0.5s ease;
        }

        #copa {
            position: absolute; top: 50%; left: 0; width: 50px;
            transform: translate(-50%, -50%) rotate(90deg);
            transition: left 0.5s ease; pointer-events: none;
        }

        #copa.completo { filter: drop-shadow(0 0 10px gold); }

        /* --- BUSCADOR --- */
        .busqueda-container {
            display: flex; justify-content: center; align-items: stretch;
            margin: 30px auto; max-width: 500px;
        }

        #busqueda {
            flex: 1; padding: 12px 15px; border: 1px solid #ccc;
            border-right: none; border-radius: 4px 0 0 4px;
            outline: none; font-size: 16px; font-family: inherit;
        }

        #btnBuscar {
            padding: 12px 25px; background: #2196F3; color: white;
            border: 1px solid #2196F3; border-radius: 0 4px 4px 0;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }

        /* --- FIGURITAS --- */
        .grid-figuritas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }

        .figurita {
            width: 65px; height: 65px; background: white;
            border: 2px solid #ccc; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 11px; cursor: pointer;
            position: relative; color: black; font-weight: bold;
            transition: transform 0.1s;
        }

        .figurita:active { transform: scale(0.95); }

        .figurita.tengo { background: #4CAF50; color: white; border-color: #2e7d32; }

        /* Contador de repetidas dentro de la figurita */
        .badge-rep {
            position: absolute; top: -5px; right: -5px;
            background: #FFC107; color: black; font-size: 10px;
            padding: 2px 5px; border-radius: 10px; border: 1px solid black;
        }

        /* Botón para restar o quitar */
        .btn-quitar {
            position: absolute; bottom: 2px; right: 2px;
            background: rgba(0,0,0,0.2); border: none; color: white;
            border-radius: 50%; width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer;
        }
        .btn-quitar:hover { background: rgba(255,0,0,0.6); }

        .hidden { display: none; }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 10px; }
            .busqueda-container { width: 95%; }
        }
    </style>
</head>
<body>

<header>
    <div>MI LISTA MUNDIALISTA</div>
    <nav>
        <button class="todas" onclick="mostrar('todas')">Todas</button>
        <button class="tengo" onclick="mostrar('tengo')">Pegadas</button>
        <button class="repetidas" onclick="mostrar('repetidas')">Repetidas</button>
        <button class="faltan" onclick="mostrar('faltan')">Faltan</button>
        <button class="pdf" onclick="generarPDF()">Descargar PDF</button>
    </nav>
</header>

<main>
    <div id="contador"></div>

    <div id="barra-container">
        <div id="barra"></div>
        <img id="copa" src="copa.png" alt="Trofeo">
    </div>

    <div class="busqueda-container">
        <input type="text" id="busqueda" placeholder="Código de país (ej: ARG)...">
        <button id="btnBuscar" onclick="buscarPais()">Buscar</button>
    </div>

    <section id="todas"></section>
    <section id="tengo" class="hidden"></section>
    <section id="repetidas" class="hidden"></section>
    <section id="faltan" class="hidden"></section>
</main>

<script>
    const codigos = [
        "FWC","MEX","RSA","KOR","CZE","CAN","BIH","QAT","SUI","BRA",
        "MAR","HAI","SCO","USA","PAR","AUS","TUR","GER","CUW",
        "CIV","ECU","NED","JPN","SWE","TUN","BEL","EGY","IRN",
        "NZL","ESP","CPV","KSA","URU","FRA","SEN","IRQ","NOR",
        "ARG","ALG","AUT","JOR","POR","COD","UZB","COL","ENG",
        "CRO","GHA","PAN"
    ];

    let figuritas = [];
    let vistaActual = "todas";

    function inicializar() {
        figuritas = [];
        codigos.forEach(codigo => {
            let inicio = (codigo === "FWC") ? 0 : 1;
            let fin = (codigo === "FWC") ? 19 : 20;
            for (let i = inicio; i <= fin; i++) {
                figuritas.push({
                    id: `${codigo} ${i.toString().padStart(2, "0")}`,
                    codigo,
                    estado: "faltan", // faltan o tengo
                    cantidad: 0 // representa REPETIDAS (la primera no cuenta como repetida)
                });
            }
        });
    }

    function mostrar(seccion) {
        vistaActual = seccion;
        ["todas", "tengo", "repetidas", "faltan"].forEach(id => {
            document.getElementById(id).classList.add("hidden");
        });
        document.getElementById(seccion).classList.remove("hidden");
    }

    function crearBloquePais(codigo) {
        const div = document.createElement("div");
        div.setAttribute("data-pais", codigo); // Esto es lo que permite que el buscador lo encuentre
        div.innerHTML = `<h3>${codigo}</h3><div class="grid-figuritas"></div>`;
        return { div, grid: div.querySelector(".grid-figuritas") };
    }

    // 2. Reemplazá tu función buscarPais por esta
    function buscarPais() {
        const inputBusqueda = document.getElementById("busqueda");
        const filtro = inputBusqueda.value.trim().toUpperCase();
        
        // Buscamos el país SOLO dentro de la pestaña que tenés abierta ahora
        const seccionActual = document.getElementById(vistaActual);
        const bloque = seccionActual.querySelector(`[data-pais="${filtro}"]`);

        if (bloque) {
            // El scrollIntoView a veces falla en celular si no tiene estos parámetros:
            bloque.scrollIntoView({ 
                behavior: "smooth", 
                block: "center",
                inline: "nearest" 
            });

            // Feedback visual: resaltamos el título para que sepas que lo encontró
            const titulo = bloque.querySelector("h3");
            titulo.style.transition = "all 0.3s";
            titulo.style.color = "#FFD700"; // Color Oro
            titulo.style.textShadow = "0 0 10px gold";
            
            setTimeout(() => {
                titulo.style.color = "";
                titulo.style.textShadow = "";
            }, 2500);

            // Cerramos el teclado en celulares
            inputBusqueda.blur(); 
        } else {
        Swal.fire({
        title: '¡País no encontrado!',
        text: `No hay figuritas de "${filtro}" en la sección ${vistaActual}`,
        icon: 'error',
        confirmButtonText: 'Entendido',
        confirmButtonColor: '#2196F3',
        background: '#1a1a1a',
        color: '#ffffff'
    });
}
    }

    document.getElementById("busqueda").addEventListener("keydown", e => {
        if (e.key === "Enter") buscarPais();
    });

    function render() {
        const secciones = {
            todas: document.getElementById("todas"),
            tengo: document.getElementById("tengo"),
            repetidas: document.getElementById("repetidas"),
            faltan: document.getElementById("faltan")
        };

        Object.keys(secciones).forEach(sec => secciones[sec].innerHTML = `<h2>${sec.toUpperCase()}</h2>`);

        const mapas = { todas: {}, tengo: {}, repetidas: {}, faltan: {} };
        codigos.forEach(codigo => {
            Object.keys(mapas).forEach(sec => mapas[sec][codigo] = crearBloquePais(codigo));
        });

        figuritas.forEach(fig => {
            const box = document.createElement("div");
            box.className = `figurita ${fig.estado === "tengo" ? "tengo" : ""}`;
            box.innerHTML = `<span>${fig.id}</span>`;

            // Si es verde, mostrar info de repetidas y botón quitar
            if (fig.estado === "tengo") {
                if (fig.cantidad > 0) {
                    const badge = document.createElement("div");
                    badge.className = "badge-rep";
                    badge.textContent = `+${fig.cantidad}`;
                    box.appendChild(badge);
                }

                const btnQuitar = document.createElement("button");
                btnQuitar.className = "btn-quitar";
                btnQuitar.textContent = "–";
                btnQuitar.onclick = (e) => {
                    e.stopPropagation(); // Evita que el click sume
                    if (fig.cantidad > 0) {
                        fig.cantidad--;
                    } else {
                        fig.estado = "faltan";
                    }
                    render();
                };
                box.appendChild(btnQuitar);
            }

            // Click principal: Lógica de suma
            box.onclick = () => {
                if (fig.estado === "faltan") {
                    fig.estado = "tengo";
                } else {
                    fig.cantidad++;
                }
                render();
            };

            // Inyectar en sección TODAS
            mapas.todas[fig.codigo].grid.appendChild(box);

            // Inyectar en secciones específicas (clones visuales)
            if (fig.estado === "tengo") {
                mapas.tengo[fig.codigo].grid.appendChild(box.cloneNode(true));
                if (fig.cantidad > 0) {
                    const repClone = box.cloneNode(true);
                    mapas.repetidas[fig.codigo].grid.appendChild(repClone);
                }
            } else {
                mapas.faltan[fig.codigo].grid.appendChild(box.cloneNode(true));
            }
        });

        // Re-asignar eventos a los clones (los clones pierden el onclick original)
        // Por simplicidad en este ejemplo, inyectamos solo los bloques necesarios
        Object.keys(mapas).forEach(sec => {
            codigos.forEach(codigo => {
                if (mapas[sec][codigo].grid.children.length > 0) {
                    // Re-renderizamos para que los clicks funcionen en todas las vistas
                    const bloque = mapas[sec][codigo].div;
                    secciones[sec].appendChild(bloque);
                }
            });
        });

        actualizarProgreso();
        localStorage.setItem("figuritas", JSON.stringify(figuritas));
    }

    // Nota: Para que los eventos funcionen en las vistas filtradas,
    // el render debe ser consistente. He ajustado el render para usar 
    // la lógica de inyección directa en lugar de clones para mantener eventos.
    
    // Función de render optimizada para mantener eventos:
    function renderMejorado() {
        const secciones = {
            todas: document.getElementById("todas"),
            tengo: document.getElementById("tengo"),
            repetidas: document.getElementById("repetidas"),
            faltan: document.getElementById("faltan")
        };

        Object.keys(secciones).forEach(sec => secciones[sec].innerHTML = "");

        const listasPaises = { todas: {}, tengo: {}, repetidas: {}, faltan: {} };

        figuritas.forEach(fig => {
            const crearFig = (isInteractive) => {
                const box = document.createElement("div");
                box.className = `figurita ${fig.estado === "tengo" ? "tengo" : ""}`;
                box.innerHTML = `<span>${fig.id}</span>`;
                
                if (fig.estado === "tengo") {
                    if (fig.cantidad > 0) {
                        const b = document.createElement("div");
                        b.className = "badge-rep";
                        b.textContent = `+${fig.cantidad}`;
                        box.appendChild(b);
                    }
                    const bq = document.createElement("button");
                    bq.className = "btn-quitar";
                    bq.textContent = "–";
                    bq.onclick = (e) => {
                        e.stopPropagation();
                        if (fig.cantidad > 0) fig.cantidad--;
                        else fig.estado = "faltan";
                        renderMejorado();
                    };
                    box.appendChild(bq);
                }

                box.onclick = () => {
                    if (fig.estado === "faltan") fig.estado = "tengo";
                    else fig.cantidad++;
                    renderMejorado();
                };
                return box;
            };

            // Todas
            if (!listasPaises.todas[fig.codigo]) listasPaises.todas[fig.codigo] = crearBloquePais(fig.codigo);
            listasPaises.todas[fig.codigo].grid.appendChild(crearFig());

            // Filtros
            if (fig.estado === "tengo") {
                if (!listasPaises.tengo[fig.codigo]) listasPaises.tengo[fig.codigo] = crearBloquePais(fig.codigo);
                listasPaises.tengo[fig.codigo].grid.appendChild(crearFig());
                
                if (fig.cantidad > 0) {
                    if (!listasPaises.repetidas[fig.codigo]) listasPaises.repetidas[fig.codigo] = crearBloquePais(fig.codigo);
                    listasPaises.repetidas[fig.codigo].grid.appendChild(crearFig());
                }
            } else {
                if (!listasPaises.faltan[fig.codigo]) listasPaises.faltan[fig.codigo] = crearBloquePais(fig.codigo);
                listasPaises.faltan[fig.codigo].grid.appendChild(crearFig());
            }
        });

        Object.keys(listasPaises).forEach(sec => {
            Object.values(listasPaises[sec]).forEach(bloque => secciones[sec].appendChild(bloque.div));
        });

        actualizarProgreso();
        localStorage.setItem("figuritas", JSON.stringify(figuritas));
    }

    function actualizarProgreso() {
        const total = figuritas.length;
        const pegadas = figuritas.filter(f => f.estado === "tengo").length;
        const totalRepetidas = figuritas.reduce((acc, f) => acc + f.cantidad, 0);
        const progreso = (pegadas / total) * 100;

        document.getElementById("contador").textContent = 
            `Pegadas: ${pegadas} de ${total} (${progreso.toFixed(1)}%) | Repetidas: ${totalRepetidas}`;
        
        document.getElementById("barra").style.width = progreso + "%";
        document.getElementById("copa").style.left = progreso + "%";

        if (progreso >= 100) document.getElementById("copa").classList.add("completo");
        else document.getElementById("copa").classList.remove("completo");
    }

    const guardado = localStorage.getItem("figuritas");
    if (guardado) figuritas = JSON.parse(guardado);
    else inicializar();

    async function generarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;

    // Configuración inicial
    doc.setFontSize(18);
    doc.setTextColor(33, 150, 243);
    doc.text("REPORTE DE ÁLBUM", 105, y, { align: "center" });
    
    y += 15;
    doc.setFontSize(10);
    doc.setTextColor(100);
    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 105, y, { align: "center" });

    // --- SECCIÓN: FALTANTES ---
    y += 15;
    doc.setFontSize(14);
    doc.setTextColor(244, 67, 54);
    doc.text("NECESITO:", 10, y);
    y += 8;
    doc.setFontSize(12);
    doc.setTextColor(0);

    codigos.forEach(c => {
        // Filtramos las que faltan para este país
        const faltan = figuritas.filter(f => f.codigo === c && f.estado === "faltan");
        
        if (faltan.length > 0) {
            // Obtenemos solo el número (la parte después del espacio)
            const numeros = faltan.map(f => f.id.split(" ")[1]).join(", ");
            const linea = `${c}: ${numeros}`;
            
            // Si nos pasamos del largo de la hoja, creamos otra
            if (y > 275) { doc.addPage(); y = 20; }
            doc.text(linea, 15, y);
            y += 6;
        }
    });

    // --- SECCIÓN: REPETIDAS ---
    y += 12;
    if (y > 275) { doc.addPage(); y = 20; }
    doc.setFontSize(14);
    doc.setTextColor(76, 175, 80);
    doc.text("MIS REPETIDAS:", 10, y);
    y += 8;
    doc.setFontSize(12);
    doc.setTextColor(0);

    codigos.forEach(c => {
        const repes = figuritas.filter(f => f.codigo === c && f.cantidad > 0);
        
        if (repes.length > 0) {
            const numerosRepes = repes.map(f => `${f.id.split(" ")[1]} (x${f.cantidad})`).join(", ");
            const lineaRepes = `${c}: ${numerosRepes}`;

            if (y > 275) { doc.addPage(); y = 20; }
            doc.text(lineaRepes, 15, y);
            y += 6;
        }
    });

    doc.save("Mi_Album_Mundial.pdf");
}

    renderMejorado();
    mostrar("todas");
</script>

</body>
</html>
