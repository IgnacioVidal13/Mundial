<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Álbum Mundial - Gestión Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS BASE --- */
        body {
            margin: 0;
            font-family: 'Oswald', Arial, sans-serif;
            background: #111;
        }

        /* --- HEADER --- */
        header {
            background: #111;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid gold;
        }

        header div { color: gold; font-size: 22px; font-weight: 700; }

        nav button {
            margin-left: 10px;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .todas { background: #2196F3; color: white; }
        .tengo { background: #4CAF50; color: white; }
        .repetidas { background: #FFC107; color: #333; }
        .faltan { background: #F44336; color: white; }
        .pdf { background: #ffffff; color: #ff0000; }
        /* --- FONDO DINÁMICO --- */
        main {
            padding: 20px;
            min-height: 100vh;
            color: white;
            background: linear-gradient(270deg, #ffffff, #67b7f4, #ffffff, #679cff);
            background-size: 800% 800%;
            animation: lava 18s ease infinite;
        }

        @keyframes lava {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

  


        /* --- PROGRESO --- */
        #contador { margin-bottom: 15px; font-size: 18px; font-weight: bold; text-shadow: 0 0 5px black; }

        
        #barra-container {
            width: 100%; height: 35px; background: #222;
            border-radius: 20px; position: relative; margin-bottom: 30px;
        }

        #barra {
            height: 100%; width: 0%; background: linear-gradient(90deg, #d4af37, #ffd700, #d4af37);
            border-radius: 20px; transition: width 0.5s ease;
        }

        #copa {
            position: absolute; top: 50%; left: 0; width: 50px;
            transform: translate(-50%, -50%) rotate(90deg);
            transition: left 0.5s ease; pointer-events: none;
        }

        #copa.completo { filter: drop-shadow(0 0 10px gold); }

        /* --- BUSCADOR --- */
        .busqueda-container {
            display: flex; justify-content: center; align-items: stretch;
            margin: 30px auto; max-width: 500px;
        }

        #busqueda {
            flex: 1; padding: 12px 15px; border: 1px solid #ccc;
            border-right: none; border-radius: 4px 0 0 4px;
            outline: none; font-size: 16px; font-family: inherit;
        }

        #btnBuscar {
            padding: 12px 25px; background: #2196F3; color: white;
            border: 1px solid #2196F3; border-radius: 0 4px 4px 0;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }

        /* --- FIGURITAS --- */
        .grid-figuritas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }

        .figurita {
            width: 65px; height: 65px; background: white;
            border: 2px solid #ccc; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 11px; cursor: pointer;
            position: relative; color: black; font-weight: bold;
            transition: transform 0.1s;
        }

        .figurita:active { transform: scale(0.95); }

        .figurita.tengo { background: #4CAF50; color: white; border-color: #2e7d32; }

        /* Contador de repetidas dentro de la figurita */
        .badge-rep {
            position: absolute; top: -5px; right: -5px;
            background: #FFC107; color: black; font-size: 10px;
            padding: 2px 5px; border-radius: 10px; border: 1px solid black;
        }

        /* Botón para restar o quitar */
        .btn-quitar {
            position: absolute; bottom: 2px; right: 2px;
            background: rgba(0,0,0,0.2); border: none; color: white;
            border-radius: 50%; width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer;
        }
        .btn-quitar:hover { background: rgba(255,0,0,0.6); }

        .hidden { display: none; }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 10px; }
            .busqueda-container { width: 95%; }
        }
    </style>
</head>
<body>

    <!-- SISTEMA DE LOGIN Y REGISTRO (INDEPENDIENTE) -->
<div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 9999; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif;">
    <div style="background: #ffffff; padding: 30px; border-radius: 15px; border: 2px solid gold; width: 90%; max-width: 400px; text-align: center;">
        <div id="login-form">
            <h2 style="color: rgb(0, 0, 0);">INICIAR SESIÓN</h2>
            <input type="text" id="user-login" placeholder="Usuario" style="width: 100%; padding: 12px; margin: 10px 0; background: #9c9c9c; color: white; border: 1px solid #444; border-radius: 5px;">
            <input type="password" id="pass-login" placeholder="Contraseña" style="width: 100%; padding: 12px; margin: 10px 0; background: #9c9c9c; color: white; border: 1px solid #444; border-radius: 5px;">
            <button onclick="auth('login')" style="width: 100%; padding: 12px; background: rgb(187, 255, 255); border: none; font-weight: bold; cursor: pointer; margin-top: 10px;">ENTRAR</button>
            <p style="color: #aaa; margin-top: 15px;">¿No tienes cuenta? <a href="#" onclick="toggleAuth()" style="color: gold;">Regístrate</a></p>
        </div>

        <div id="register-form" style="display: none;">
            <h2 style="color: #5e5e5e;">CREAR CUENTA</h2>
            <input type="text" id="user-reg" placeholder="Nuevo Usuario" style="width: 100%; padding: 12px; margin: 10px 0; background: #9c9c9c; color: white; border: 1px solid #444; border-radius: 5px;">
            <input type="password" id="pass-reg" placeholder="Contraseña" style="width: 100%; padding: 12px; margin: 10px 0; background: #9c9c9c; color: white; border: 1px solid #444; border-radius: 5px;">
            <button onclick="auth('register')" style="width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px;">REGISTRARME</button>
            <p style="color: #aaa; margin-top: 15px;">¿Ya tienes cuenta? <a href="#" onclick="toggleAuth()" style="color: rgb(166, 255, 246);">Inicia sesión</a></p>
        </div>
    </div>
</div>

<script>
    let usuarioActual = "";

    function toggleAuth() {
        const l = document.getElementById('login-form');
        const r = document.getElementById('register-form');
        l.style.display = l.style.display === 'none' ? 'block' : 'none';
        r.style.display = r.style.display === 'none' ? 'block' : 'none';
    }

    function auth(tipo) {
        const u = document.getElementById(tipo === 'login' ? 'user-login' : 'user-reg').value.trim().toLowerCase();
        const p = document.getElementById(tipo === 'login' ? 'pass-login' : 'pass-reg').value;

        if (!u || !p) return Swal.fire('Error', 'Completa los campos', 'error');

        let usuarios = JSON.parse(localStorage.getItem('db_usuarios') || '{}');

        if (tipo === 'register') {
            if (usuarios[u]) return Swal.fire('Error', 'El usuario ya existe', 'error');
            usuarios[u] = { password: p };
            localStorage.setItem('db_usuarios', JSON.stringify(usuarios));
            // Crear álbum vacío para el nuevo usuario
            inicializar(); // Esta es TU función original
            localStorage.setItem("figuritas_" + u, JSON.stringify(figuritas));
            Swal.fire('Éxito', 'Cuenta creada. Ahora inicia sesión.', 'success');
            toggleAuth();
        } else {
            if (usuarios[u] && usuarios[u].password === p) {
                usuarioActual = u;
                document.getElementById('login-overlay').style.display = 'none';
                cargarDatosUsuario();
            } else {
                Swal.fire('Error', 'Credenciales inválidas', 'error');
            }
        }
    }

    function cargarDatosUsuario() {
        const datos = localStorage.getItem("figuritas_" + usuarioActual);
        if (datos) {
            figuritas = JSON.parse(datos);
        } else {
            inicializar(); 
        }
        renderMejorado(); // Esta es TU función original
    }

    // SOBREESCRITURA SUTIL (Para que guarde por usuario sin borrar tu código)
    const originalRenderMejorado = renderMejorado;
    renderMejorado = function() {
        originalRenderMejorado();
        if (usuarioActual) {
            localStorage.setItem("figuritas_" + usuarioActual, JSON.stringify(figuritas));
        }
    };
</script>
    
<style>
    /* Estilos extra solo para el login */
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(5px); }
        50% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
        100% { transform: translateX(0); }
    }
   /* Forzamos a SweetAlert a estar por encima del login */
    .swal2-container {
        z-index: 10000 !important;
    }

</style>
<!-- FIN DEL INICIO DE SESIÓN -->

<header>
    <div>MI LISTA MUNDIALISTA</div>
    <nav>
        <button class="todas" onclick="mostrar('todas')">Todas</button>
        <button class="tengo" onclick="mostrar('tengo')">Pegadas</button>
        <button class="repetidas" onclick="mostrar('repetidas')">Repetidas</button>
        <button class="faltan" onclick="mostrar('faltan')">Faltan</button>
        <button class="pdf" onclick="generarPDF()">Descargar PDF</button>
    </nav>
</header>

<main>
    <div id="contador"></div>

    <div id="barra-container">
        <div id="barra"></div>
        <img id="copa" src="copa.png" alt="Trofeo">
    </div>

    <div class="busqueda-container">
        <input type="text" id="busqueda" placeholder="Código de país (ej: ARG)...">
        <button id="btnBuscar" onclick="buscarPais()">Buscar</button>
        <button onclick="activarVoz()" style="background: #96d6ea; color: white; border-radius: 50%; width: 50px; height: 50px; border: none; cursor: pointer;">
    🎤
</button>
    </div>

    <section id="todas"></section>
    <section id="tengo" class="hidden"></section>
    <section id="repetidas" class="hidden"></section>
    <section id="faltan" class="hidden"></section>
</main>

<script>
    const codigos = [
        "FWC","MEX","RSA","KOR","CZE","CAN","BIH","QAT","SUI","BRA",
        "MAR","HAI","SCO","USA","PAR","AUS","TUR","GER","CUW",
        "CIV","ECU","NED","JPN","SWE","TUN","BEL","EGY","IRN",
        "NZL","ESP","CPV","KSA","URU","FRA","SEN","IRQ","NOR",
        "ARG","ALG","AUT","JOR","POR","COD","UZB","COL","ENG",
        "CRO","GHA","PAN"
    ];

    let figuritas = [];
    let vistaActual = "todas";

    function inicializar() {
        figuritas = [];
        codigos.forEach(codigo => {
            let inicio = (codigo === "FWC") ? 0 : 1;
            let fin = (codigo === "FWC") ? 19 : 20;
            for (let i = inicio; i <= fin; i++) {
                figuritas.push({
                    id: `${codigo} ${i.toString().padStart(2, "0")}`,
                    codigo,
                    estado: "faltan", // faltan o tengo
                    cantidad: 0 // representa REPETIDAS (la primera no cuenta como repetida)
                });
            }
        });
    }

    function mostrar(seccion) {
        vistaActual = seccion;
        ["todas", "tengo", "repetidas", "faltan"].forEach(id => {
            document.getElementById(id).classList.add("hidden");
        });
        document.getElementById(seccion).classList.remove("hidden");
    }

    function crearBloquePais(codigo) {
        const div = document.createElement("div");
        div.setAttribute("data-pais", codigo); // Esto es lo que permite que el buscador lo encuentre
        div.innerHTML = `<h3>${codigo}</h3><div class="grid-figuritas"></div>`;
        return { div, grid: div.querySelector(".grid-figuritas") };
    }

    // 2. Reemplazá tu función buscarPais por esta
    function buscarPais() {
    const inputBusqueda = document.getElementById("busqueda");
    const filtro = inputBusqueda.value.trim().toUpperCase();
    
    if (!filtro) return;

    // Buscamos en TODA la página el bloque que tenga ese data-pais
    // y que NO esté oculto (display != none)
    const bloques = document.querySelectorAll(`[data-pais="${filtro}"]`);
    let bloqueEncontrado = null;

    // Filtramos para encontrar el bloque que está en la pestaña que estás viendo
    bloques.forEach(b => {
        if (b.offsetParent !== null) { 
            bloqueEncontrado = b;
        }
    });

    if (bloqueEncontrado) {
        bloqueEncontrado.scrollIntoView({ 
            behavior: "smooth", 
            block: "center"
        });

        const titulo = bloqueEncontrado.querySelector("h3");
        if (titulo) {
            titulo.style.transition = "all 0.3s";
            titulo.style.color = "#FFD700"; 
            titulo.style.textShadow = "0 0 10px gold";
            
            setTimeout(() => {
                titulo.style.color = "";
                titulo.style.textShadow = "";
            }, 2500);
        }
        inputBusqueda.blur(); 
    } else {
        Swal.fire({
            title: '¡País no encontrado!',
            text: `No hay figuritas de "${filtro}" en esta sección.`,
            icon: 'error',
            confirmButtonColor: '#2196F3',
            background: '#1a1a1a',
            color: '#ffffff',
            allowEnterKey: false, // Evita el cierre rápido con Enter
            stopKeydownPropagation: true // Frena el evento para que no afecte al input
        });
    }
}

// Escuchar el Enter
document.getElementById("busqueda").addEventListener("keydown", e => {
    if (e.key === "Enter") buscarPais();
});

    function render() {
        const secciones = {
            todas: document.getElementById("todas"),
            tengo: document.getElementById("tengo"),
            repetidas: document.getElementById("repetidas"),
            faltan: document.getElementById("faltan")
        };

        Object.keys(secciones).forEach(sec => secciones[sec].innerHTML = `<h2>${sec.toUpperCase()}</h2>`);

        const mapas = { todas: {}, tengo: {}, repetidas: {}, faltan: {} };
        codigos.forEach(codigo => {
            Object.keys(mapas).forEach(sec => mapas[sec][codigo] = crearBloquePais(codigo));
        });

        figuritas.forEach(fig => {
            const box = document.createElement("div");
            box.className = `figurita ${fig.estado === "tengo" ? "tengo" : ""}`;
            box.innerHTML = `<span>${fig.id}</span>`;

            // Si es verde, mostrar info de repetidas y botón quitar
            if (fig.estado === "tengo") {
                if (fig.cantidad > 0) {
                    const badge = document.createElement("div");
                    badge.className = "badge-rep";
                    badge.textContent = `+${fig.cantidad}`;
                    box.appendChild(badge);
                }

                const btnQuitar = document.createElement("button");
                btnQuitar.className = "btn-quitar";
                btnQuitar.textContent = "–";
                btnQuitar.onclick = (e) => {
                    e.stopPropagation(); // Evita que el click sume
                    if (fig.cantidad > 0) {
                        fig.cantidad--;
                    } else {
                        fig.estado = "faltan";
                    }
                    render();
                };
                box.appendChild(btnQuitar);
            }

            // Click principal: Lógica de suma
            box.onclick = () => {
                if (fig.estado === "faltan") {
                    fig.estado = "tengo";
                } else {
                    fig.cantidad++;
                }
                render();
            };

            // Inyectar en sección TODAS
            mapas.todas[fig.codigo].grid.appendChild(box);

            // Inyectar en secciones específicas (clones visuales)
            if (fig.estado === "tengo") {
                mapas.tengo[fig.codigo].grid.appendChild(box.cloneNode(true));
                if (fig.cantidad > 0) {
                    const repClone = box.cloneNode(true);
                    mapas.repetidas[fig.codigo].grid.appendChild(repClone);
                }
            } else {
                mapas.faltan[fig.codigo].grid.appendChild(box.cloneNode(true));
            }
        });

        // Re-asignar eventos a los clones (los clones pierden el onclick original)
        // Por simplicidad en este ejemplo, inyectamos solo los bloques necesarios
        Object.keys(mapas).forEach(sec => {
            codigos.forEach(codigo => {
                if (mapas[sec][codigo].grid.children.length > 0) {
                    // Re-renderizamos para que los clicks funcionen en todas las vistas
                    const bloque = mapas[sec][codigo].div;
                    secciones[sec].appendChild(bloque);
                }
            });
        });

        actualizarProgreso();
        localStorage.setItem("figuritas", JSON.stringify(figuritas));
    }

    // Nota: Para que los eventos funcionen en las vistas filtradas,
    // el render debe ser consistente. He ajustado el render para usar 
    // la lógica de inyección directa en lugar de clones para mantener eventos.
    
    // Función de render optimizada para mantener eventos:
    function renderMejorado() {
        const secciones = {
            todas: document.getElementById("todas"),
            tengo: document.getElementById("tengo"),
            repetidas: document.getElementById("repetidas"),
            faltan: document.getElementById("faltan")
        };

        Object.keys(secciones).forEach(sec => secciones[sec].innerHTML = "");

        const listasPaises = { todas: {}, tengo: {}, repetidas: {}, faltan: {} };

        figuritas.forEach(fig => {
            const crearFig = (isInteractive) => {
                const box = document.createElement("div");
                box.className = `figurita ${fig.estado === "tengo" ? "tengo" : ""}`;
                box.innerHTML = `<span>${fig.id}</span>`;
                
                if (fig.estado === "tengo") {
                    if (fig.cantidad > 0) {
                        const b = document.createElement("div");
                        b.className = "badge-rep";
                        b.textContent = `+${fig.cantidad}`;
                        box.appendChild(b);
                    }
                    const bq = document.createElement("button");
                    bq.className = "btn-quitar";
                    bq.textContent = "–";
                    bq.onclick = (e) => {
                        e.stopPropagation();
                        if (fig.cantidad > 0) fig.cantidad--;
                        else fig.estado = "faltan";
                        renderMejorado();
                    };
                    box.appendChild(bq);
                }

                box.onclick = () => {
                    if (fig.estado === "faltan") fig.estado = "tengo";
                    else fig.cantidad++;
                    renderMejorado();
                };
                return box;
            };

            // Todas
            if (!listasPaises.todas[fig.codigo]) listasPaises.todas[fig.codigo] = crearBloquePais(fig.codigo);
            listasPaises.todas[fig.codigo].grid.appendChild(crearFig());

            // Filtros
            if (fig.estado === "tengo") {
                if (!listasPaises.tengo[fig.codigo]) listasPaises.tengo[fig.codigo] = crearBloquePais(fig.codigo);
                listasPaises.tengo[fig.codigo].grid.appendChild(crearFig());
                
                if (fig.cantidad > 0) {
                    if (!listasPaises.repetidas[fig.codigo]) listasPaises.repetidas[fig.codigo] = crearBloquePais(fig.codigo);
                    listasPaises.repetidas[fig.codigo].grid.appendChild(crearFig());
                }
            } else {
                if (!listasPaises.faltan[fig.codigo]) listasPaises.faltan[fig.codigo] = crearBloquePais(fig.codigo);
                listasPaises.faltan[fig.codigo].grid.appendChild(crearFig());
            }
        });

        Object.keys(listasPaises).forEach(sec => {
            Object.values(listasPaises[sec]).forEach(bloque => secciones[sec].appendChild(bloque.div));
        });

        actualizarProgreso();
        localStorage.setItem("figuritas", JSON.stringify(figuritas));
    }

    function actualizarProgreso() {
        const total = figuritas.length;
        const pegadas = figuritas.filter(f => f.estado === "tengo").length;
        const totalRepetidas = figuritas.reduce((acc, f) => acc + f.cantidad, 0);
        const progreso = (pegadas / total) * 100;

        document.getElementById("contador").textContent = 
            `Pegadas: ${pegadas} de ${total} (${progreso.toFixed(1)}%) | Repetidas: ${totalRepetidas}`;
        
        document.getElementById("barra").style.width = progreso + "%";
        document.getElementById("copa").style.left = progreso + "%";

        if (progreso >= 100) document.getElementById("copa").classList.add("completo");
        else document.getElementById("copa").classList.remove("completo");
    }

    const guardado = localStorage.getItem("figuritas");
    if (guardado) figuritas = JSON.parse(guardado);
    else inicializar();

    async function generarPDF() {
    const { value: tituloUsuario } = await Swal.fire({
        title: 'Escribi tu nombre',
        input: 'text',
        inputValue: '',
        showCancelButton: true,
        confirmButtonText: 'Generar',
        cancelButtonText: 'Cerrar',
        confirmButtonColor: '#007bff',
        cancelButtonColor: '#dc3545',
        background: '#1a1a1a', color: '#ffffff'
    });

    if (!tituloUsuario) return;

    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // --- 1. DATOS LIMPIOS ---
        // Usamos una copia profunda para evitar conflictos de memoria en iOS
        const copiaFiguritas = JSON.parse(JSON.stringify(figuritas));
        const total = copiaFiguritas.length;
        const tengo = copiaFiguritas.filter(f => String(f.estado).toLowerCase() === "tengo").length;
        const faltanTotal = total - tengo;
        const porcentaje = ((tengo / total) * 100).toFixed(1);

        const listaCodigos = ["FWC","MEX","RSA","KOR","CZE","CAN","BIH","QAT","SUI","BRA","MAR","HAI","SCO","USA","PAR","AUS","TUR","GER","CUW","CIV","ECU","NED","JPN","SWE","TUN","BEL","EGY","IRN","NZL","ESP","CPV","KSA","URU","FRA","SEN","IRQ","NOR","ARG","ALG","AUT","JOR","POR","COD","UZB","COL","ENG","CRO","GHA","PAN"];

        let y = 20;

        // --- 2. ENCABEZADO ---
        doc.setFontSize(20);
        doc.setTextColor(255, 87, 34);
        doc.text(tituloUsuario.toUpperCase(), 105, y, { align: "center" });
        y += 15;

        doc.setFillColor(240, 240, 240);
        doc.rect(15, y, 180, 25, 'F');
        doc.setFontSize(10);
        doc.setTextColor(40);
        doc.text(`Álbum de: ${tituloUsuario}`, 25, y + 10);
        doc.text(`Progreso: ${porcentaje}% (${tengo}/${total})`, 25, y + 18);
        doc.setTextColor(220, 20, 20);
        doc.text(`FALTAN: ${faltanTotal}`, 140, y + 14);
        y += 35;

        // --- 3. BUCLE DE FALTANTES (CON PROTECCIÓN ANTI-ERRORES) ---
        doc.setFontSize(14);
        doc.setTextColor(220, 20, 20);
        doc.text("DETALLE DE FALTANTES", 15, y);
        y += 10;

        for (let i = 0; i < listaCodigos.length; i++) {
            try {
                const cod = listaCodigos[i];
                const faltantes = copiaFiguritas.filter(f => 
                    String(f.codigo).toUpperCase() === cod && 
                    String(f.estado).toLowerCase() !== "tengo"
                );

                if (faltantes.length > 0) {
                    const nums = faltantes.map(f => String(f.id).replace(cod, "").trim()).join(", ");

recognition.lang = 'es-AR'; 
recognition.continuous = true;

};

let timerSeguridad;

function activarVoz() {
    try {
        recognition.start();
        clearTimeout(timerSeguridad);

        // CORTE DE SEGURIDAD 10 SEG
        timerSeguridad = setTimeout(() => {
            recognition.stop();
            Swal.fire({ title: 'Micrófono apagado', icon: 'warning', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
        }, 10000);

        Swal.fire({ title: 'Escuchando...', icon: 'info', showConfirmButton: false, timer: 1500, toast: true, position: 'top' });
    } catch (e) { console.log("Micro ya activo"); }
}

// 2. PROCESAMIENTO DE VOZ
recognition.onresult = (event) => {
    const vozOriginal = event.results[event.results.length - 1][0].transcript.toLowerCase();
    
    // Mostramos qué entendió
    Swal.fire({ title: 'Entendido:', text: `"${vozOriginal}"`, icon: 'success', toast: true, position: 'bottom', timer: 2000, showConfirmButton: false });

    const frase = vozOriginal.replace("por", "|");
    const partes = frase.split("|");

    if (partes.length >= 2) {
        const p1 = extraerDatosPro(partes[0]);
        const p2 = extraerDatosPro(partes[1]);

        if (p1 && p2) {
            ejecutarCambioVoz(p1.cod, p1.num, p2.cod, p2.num);
            clearTimeout(timerSeguridad);
            recognition.stop();
        }
    }
};

function extraerDatosPro(texto) {
    let cod = null;
    let num = null;

    // 1. Limpiamos el texto para separar letras de números (ej: "fw05" -> "fw 05")
    const textoLimpio = texto.replace(/([a-z]+)(\d+)/i, '$1 $2');
    
    // 2. Extraer el número
    const nMatch = textoLimpio.match(/\d+/);
    if (nMatch) num = parseInt(nMatch[0]);

    // 3. Diccionario de "Abreviaturas rápidas" que el mic suele confundir
    const abreviaturas = {
        "fw": "FWC",
        "mx": "MEX",
        "ar": "ARG",
        "br": "BRA",
        "rsa": "RSA",
        "kor": "KOR",
        "cze": "CZE",
        "sce": "SCO",
        "usa": "USA",
        "us" : "USA",
        "cso": "SCO",
        "sui": "SUI",
        "qat": "QAT",
        "mar": "MAR",
        "hai": "HAI",
        "sco": "SCO",
        "par": "PAR",
        "aus": "AUS",
        "tur": "TUR",
        "ger": "GER",
        "cuw": "CUW",
        "civ": "CIV",
        "cu ": "CUW",
        "rsa": "RSA",
        "cor": "KOR",
    };

    // 4. Buscar en el diccionario principal de países
    for (let nombre in diccionarioPaises) {
        if (textoLimpio.includes(nombre)) { 
            cod = diccionarioPaises[nombre]; 
            break; 
        }
    }

    // 5. Si no lo encontró, ver si es una abreviatura de 2 letras (como tu imagen)
    if (!cod) {
        for (let abrev in abreviaturas) {
            if (textoLimpio.includes(abrev)) {
                cod = abreviaturas[abrev];
                break;
            }
        }
    }

    // 6. Si sigue sin aparecer, buscar cualquier código de 3 letras
    if (!cod) {
        const cMatch = textoLimpio.match(/[a-z]{3}/i);
        if (cMatch) cod = cMatch[0].toUpperCase();
    }

    return (cod && num !== null) ? { cod, num } : null;
}

// ESTA FUNCIÓN TAMBIÉN CAMBIA PARA SER MÁS FLEXIBLE
function ejecutarCambioVoz(p1, n1, p2, n2) {
    const pais1 = p1.toUpperCase().trim();
    const pais2 = p2.toUpperCase().trim();

    // Buscamos la figu asegurando que el ID coincida con el formato "COD NUM" (con espacio)
    const figuDoy = figuritas.find(f => {
        const partesId = f.id.split(' ');
        return f.codigo.toUpperCase() === pais1 && parseInt(partesId[1]) === n1;
    });

    const figuRecibo = figuritas.find(f => {
        const partesId = f.id.split(' ');
        return f.codigo.toUpperCase() === pais2 && parseInt(partesId[1]) === n2;
    });

    if (figuDoy && figuRecibo) {
        if (figuDoy.estado === "tengo") {
            if (figuDoy.cantidad > 0) figuDoy.cantidad--;
            else figuDoy.estado = "faltan";

            figuRecibo.estado = "tengo";
            
            renderMejorado(); 
            if(typeof guardarDatos === "function") guardarDatos();

            Swal.fire({ 
                title: '¡Cambio Exitoso!', 
                text: `${pais1} ${n1} → ${pais2} ${n2}`, 
                icon: 'success',
                background: '#1a1a1a',
                color: '#ffffff'
            });
        } else {
            Swal.fire('Error', `No tenés a ${pais1} ${n1}`, 'error');
        }
    } else {
        // Si no las encuentra, te avisa qué códigos intentó usar para que corrijas
        Swal.fire({
            title: 'No encontré las figuritas',
            text: `Buscando: ${pais1} ${n1} y ${pais2} ${n2}`,
            icon: 'warning'
        });
    }
}
